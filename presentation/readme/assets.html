<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>README assets</title>
<link rel="stylesheet" href="../../frontend/src/shared/styles/tokens/palette.css">
<link rel="stylesheet" href="../../frontend/src/shared/styles/tokens/semantic.css">
<link rel="stylesheet" href="../../frontend/src/shared/styles/tokens/typography.css">
<link rel="stylesheet" href="../../frontend/src/shared/styles/tokens/radius.css">
<link rel="stylesheet" href="../../frontend/src/shared/styles/tokens/space.css">
<style>
@font-face {
  font-family: "Open Sans";
  font-weight: 300 800;
  src: url("../../frontend/public/fonts/open-sans/open-sans-cyrillic-wght-normal.woff2") format("woff2");
  unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}

@font-face {
  font-family: "Open Sans";
  font-weight: 300 800;
  src: url("../../frontend/public/fonts/open-sans/open-sans-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2212;
}

:root:has([data-portal]) {
  --font-sans: var(--font-family);
  --surface-raised: var(--surface-card);
  --surface-sunken: var(--surface-field);
  --radius-md: var(--radius-none);
  --radius-sm: var(--radius-none);
  --radius-pill: var(--radius-round);
  --text-accent: var(--action-primary);
}

:root[data-theme="dark"]:has([data-portal]) {
  --surface-card: #1c2230;
  --surface-field: #262e3f;
  --surface-page: #141922;
  --text-primary: #eef2f8;
  --text-secondary: #b6c0d0;
  --text-muted: #9aa5b8;
  --text-link: #8fb2ea;
  --border-subtle: #3a4458;
  --border-strong: #4c5870;
  --action-primary: #e2453b;
  --action-primary-text: #ffffff;
  --text-warning: #ff9b54;
}
</style>
<style>
html,
body {
  margin: 0;
  background: transparent;
}

body {
  display: grid;
  justify-items: start;
  gap: 32px;
  padding: 48px;
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

[data-asset] {
  box-sizing: border-box;
}

#generated {
  display: grid;
  justify-items: start;
  gap: 24px;
}

#icons {
  display: none;
}

.banner {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 22px;
  width: 880px;
  height: 200px;
}

.lockup {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
}

.mark {
  display: block;
  width: 72px;
  height: 72px;
}

.mark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.mark-base {
  fill: var(--text-primary);
}

.mark-accent {
  fill: var(--action-primary);
}

.wordmark {
  font-size: 72px;
  font-weight: 650;
  line-height: 1;
  letter-spacing: -0.04em;
}

.promise {
  position: relative;
  max-width: 720px;
  margin: 18px 0 0;
  text-align: center;
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--text-secondary);
  text-wrap: balance;
}

.promise em {
  font-style: normal;
  color: var(--text-accent, var(--action-primary));
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 18px 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-raised);
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-primary);
}

.cta.is-primary {
  border-color: transparent;
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.cta svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.badge {
  display: inline-flex;
  align-items: stretch;
  height: 28px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
}

.badge > span {
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
}

.badge > .label {
  background: var(--surface-sunken);
  color: var(--text-secondary);
}

.badge > .value {
  background: var(--surface-raised);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.badge.is-accent {
  border-color: var(--action-primary);
}

.badge.is-accent > .value {
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.badge.is-nav {
  height: 26px;
  border-color: var(--border-subtle);
  border-radius: var(--radius-pill);
}

.badge.is-nav > .value {
  padding: 0 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.badge.is-warning > .value {
  color: var(--text-warning, var(--status-warning));
}

.text {
  display: block;
  line-height: 1;
  text-box: trim-both cap alphabetic;
}
</style>
</head>
<body data-portal>


<div id="generated"></div>

<div id="icons">
  <svg data-icon="external-link" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
  <svg data-icon="terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></svg>
  <svg data-icon="book-open" viewBox="0 0 24 24"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
  <svg data-icon="play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></svg>
  <svg data-icon="file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></svg>
</div>

</body>
</html>
