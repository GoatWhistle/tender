[project]
name = "rag"
version = "0.1.0"
description = "Прототип RAG по справочнику КТРУ"
authors = [
    { name = "gglamer", email = "azamat201760@ya.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "truststore>=0.10.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag.main:run"
rag-hello = "rag.main:run_hello"
rag-parse = "rag.index:parse"
rag-embed = "rag.index:embed_index"
rag-search = "rag.search:run"
rag-rerank = "rag.rerank:run"
rag-fix = "rag.preprocess:run"
rag-ask = "rag.cli:run"
rag-api = "rag.api:run"
rag-ste = "rag.suggest:build_index"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
