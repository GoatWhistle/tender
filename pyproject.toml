[project]
name = "tender"
version = "0.1.0"
description = "Автозаполнение ключевых характеристик СТЕ и подбор кода КТРУ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
