[project]
name = "rag"
version = "0.1.0"
description = "Прототип RAG по справочнику КТРУ"
authors = [
    { name = "gglamer", email = "azamat201760@ya.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "truststore>=0.10.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-parse = "rag.main:run_parse"
rag-embed = "rag.main:run_embed"
rag-search = "rag.main:run_search"
rag-rerank = "rag.main:run_rerank"
rag-fix = "rag.main:run_fix"
rag-ask = "rag.main:run_ask"
rag-api = "rag.main:run_api"
rag-ste = "rag.main:run_ste"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
