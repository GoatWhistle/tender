[project]
name = "tender-backend"
description = "Автозаполнение ключевых характеристик СТЕ и подбор кода КТРУ"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115",
    "lxml>=5.0",
    # Индексы поиска групп КТРУ — только в `app.adapter`.
    "numpy>=1.26",
    "pydantic-settings>=2.8",
    "scikit-learn>=1.5",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "lxml-stubs>=0.5",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-openpyxl>=3.1",
]
# Офлайн-артефакты `build_var.py` и скрипты замеров `evals/`.
evals = [
    "openpyxl>=3.1",
]

[tool.uv]
default-groups = ["dev", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID251"]
# Тексты по-русски: кириллица — не опечатка в латинице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.create_engine".msg = "движок — через app.repository.database.create_db_engine"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
