services:
  openjev:
    profiles: [gpu]
    platform: linux/amd64
    image: tender-openjev:4b-v5
    build:
      context: .
      dockerfile: services/openjev/Dockerfile
    init: true
    ports:
      - "${OPENJEV_BIND_ADDRESS:-127.0.0.1}:${OPENJEV_PORT:-8000}:8000"
    environment:
      OPENJEV_MODEL_DIR: /models/openjev
      OPENJEV_MAX_TOKENS: ${OPENJEV_MAX_TOKENS:-4096}
      OPENJEV_MAX_BATCH: ${OPENJEV_MAX_BATCH:-32}
      OPENJEV_MICROBATCH: ${OPENJEV_MICROBATCH:-4}
      OPENJEV_MICROBATCH_TOKENS: ${OPENJEV_MICROBATCH_TOKENS:-16384}
      OPENJEV_QUEUE_SIZE: ${OPENJEV_QUEUE_SIZE:-8}
      OPENJEV_REQUEST_TIMEOUT: ${OPENJEV_REQUEST_TIMEOUT:-120}
      OPENJEV_MAX_BODY_BYTES: ${OPENJEV_MAX_BODY_BYTES:-1048576}
      OPENJEV_CACHE_ENTRIES: ${OPENJEV_CACHE_ENTRIES:-8}
      OPENJEV_CACHE_BYTES: ${OPENJEV_CACHE_BYTES:-1073741824}
      OPENJEV_CACHE_TOKENS: ${OPENJEV_CACHE_TOKENS:-32768}
      OPENJEV_CACHE_TTL: ${OPENJEV_CACHE_TTL:-300}
    volumes:
      - openjev-weights:/models/openjev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 6
    restart: unless-stopped
    stop_grace_period: 180s

volumes:
  openjev-weights:
