# Use with compose.yaml; all model services share GPU 0 on the tested A100 40GB.
services:
  qwen-download:
    profiles: [download]
    image: tender-qwen:vllm-0.22.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/qwen/Dockerfile
    entrypoint: [python, /app/qwen/download.py, --root, /models/qwen]
    environment:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - qwen-weights:/models/qwen

  qwen-embedding:
    profiles: [gpu]
    image: tender-qwen:vllm-0.22.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/qwen/Dockerfile
    command: [embedding]
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8081}:8000"
    environment:
      EMBEDDING_GPU_MEMORY_UTILIZATION: ${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.08}
    volumes:
      - qwen-weights:/models/qwen:ro
      - qwen-embedding-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 6
    restart: unless-stopped

  qwen-engine:
    profiles: [gpu]
    image: tender-qwen:vllm-0.22.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/qwen/Dockerfile
    command: [extractor]
    depends_on:
      qwen-embedding:
        condition: service_healthy
    init: true
    shm_size: 1gb
    environment:
      EXTRACTOR_GPU_MEMORY_UTILIZATION: ${EXTRACTOR_GPU_MEMORY_UTILIZATION:-0.35}
    volumes:
      - qwen-weights:/models/qwen:ro
      - qwen-extractor-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20m
      retries: 6
    restart: unless-stopped

  qwen-extractor:
    profiles: [gpu]
    image: tender-qwen-strict:1
    build:
      context: .
      dockerfile: services/qwen/Dockerfile.strict
    init: true
    environment:
      QWEN_ENGINE_URL: http://qwen-engine:8000
    ports:
      - "127.0.0.1:${EXTRACTOR_PORT:-8082}:8000"
    depends_on:
      qwen-engine:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 12m
      retries: 6
    restart: unless-stopped

volumes:
  qwen-weights:
  qwen-embedding-cache:
  qwen-extractor-cache:
